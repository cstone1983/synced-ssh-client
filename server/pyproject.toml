[project]
name = "sshsync-server"
version = "0.1.0"
description = "Self-hosted sync server for the synced SSH client: stores opaque encrypted blobs."
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "sqlalchemy==2.1.9",
    "uvicorn==0.54.0",
]

[project.scripts]
sshsync = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
]
