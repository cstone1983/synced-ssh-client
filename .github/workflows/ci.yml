name: CI

on:
  push:
    branches: ["**"]
    # A windows-v* tag on main (e.g. windows-v0.1.0) also publishes a GitHub
    # release with the Windows installer. See docs/RELEASING.md.
    tags: ["windows-v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -q

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y putty-tools openssh-server
      - name: Analyze and test (unit + two-client integration against the real server)
        working-directory: packages/core
        run: |
          dart pub get
          dart analyze
          dart test -x ssh
      - name: SSH tests against a local OpenSSH server
        working-directory: packages/core
        run: sudo env "PATH=$PATH" dart test -t ssh

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and run the integration test against the container
        run: |
          docker build -t sshsync-server server
          mkdir -p "$RUNNER_TEMP/data" && chmod 777 "$RUNNER_TEMP/data"
          docker run -d --name sshsync -p 127.0.0.1:18080:8080 -v "$RUNNER_TEMP/data:/data" -e SSHSYNC_RATE_LIMIT=off sshsync-server
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:18080/healthz && break; sleep 1; done
          docker logs sshsync 2>&1 | grep -oE '[A-HJKMNP-Z2-9]{5}-[A-HJKMNP-Z2-9]{5}' | head -1 > "$RUNNER_TEMP/code"
          test -s "$RUNNER_TEMP/code"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: packages/core
        run: |
          dart pub get
          SSHSYNC_TEST_URL=http://127.0.0.1:18080 SSHSYNC_TEST_CODE="$(cat "$RUNNER_TEMP/code")" \
            SSHSYNC_TEST_DB="$RUNNER_TEMP/data/sshsync.db" dart test -t integration

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sshsync-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Work out the version
        shell: pwsh
        run: |
          # A windows-v* tag sets the version; otherwise pubspec's (without +build).
          if ($env:GITHUB_REF -like "refs/tags/windows-v*") {
            $ver = $env:GITHUB_REF_NAME.Substring("windows-v".Length)
          } else {
            $ver = ((Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value)
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Version '$ver' is not like 1.2.3 or 1.2.3-beta1" }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          # APP_VERSION is what the built-in updater compares against GitHub releases.
          $name = ($env:APP_VERSION -split '-')[0]
          flutter build windows --release --build-name=$name --dart-define=APP_VERSION=$env:APP_VERSION
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:APP_VERSION" app\installer\sshsync.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          # The updater refuses an installer that does not match this file.
          Get-ChildItem app\build\installer\*.exe | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }
      - uses: actions/upload-artifact@v4
        with:
          name: sshsync-windows-installer
          path: app/build/installer/*
      - uses: actions/upload-artifact@v4
        with:
          name: sshsync-windows-portable
          path: app/build/windows/x64/runner/Release

  windows-release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: [server, core, server-image, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sshsync-windows-installer
          path: installer
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#windows-v}"
          prerelease=""
          case "$ver" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # The tag was made with GitHub's "Draft a new release" form: add the files to that release.
            gh release upload "$GITHUB_REF_NAME" installer/*.exe installer/*.exe.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installer/*.exe installer/*.exe.sha256 \
              --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
              --title "SSH Sync for Windows $ver" \
              --notes "Windows installer built from $GITHUB_SHA. SHA-256: $(cut -d' ' -f1 installer/*.exe.sha256)"
          fi
